name: Mehrieh v9 Exact Source CI

on:
  push:
    branches:
      - fix/mehrieh-workflow-rankmath-real
    paths:
      - 'automation/mehrieh/**'
      - 'wordpress-plugin/cheraghi-content-bridge-v3/**'
      - '.github/workflows/mehrieh-v9-exact-ci.yml'
  pull_request:
    paths:
      - 'automation/mehrieh/**'
      - 'wordpress-plugin/cheraghi-content-bridge-v3/**'
      - '.github/workflows/mehrieh-v9-exact-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Verify exact workflow SHA256
        shell: bash
        run: |
          set -euo pipefail
          test -f automation/mehrieh/CHERAGHILAW-MEHRIEH-ARTICLES-ONLY-REAL-RANKMATH-v9.0.0.json
          echo '0e4e423e0d04da330926a72687c93cfc4f3196aa38307f09bb61b03705ea88e7  automation/mehrieh/CHERAGHILAW-MEHRIEH-ARTICLES-ONLY-REAL-RANKMATH-v9.0.0.json' | sha256sum -c -

      - name: Verify exact Bridge SHA256
        shell: bash
        run: |
          set -euo pipefail
          test -f wordpress-plugin/cheraghi-content-bridge-v3/cheraghi-content-bridge-v3.php
          echo 'bec81506529ddf7dbe60899e0d92d5d37b9ec9cdcae0b9818aadc53a21330e41  wordpress-plugin/cheraghi-content-bridge-v3/cheraghi-content-bridge-v3.php' | sha256sum -c -

      - name: PHP syntax
        run: php -l wordpress-plugin/cheraghi-content-bridge-v3/cheraghi-content-bridge-v3.php

      - name: Static contract validation
        run: python3 automation/mehrieh/tests/validate.py

      - name: Workflow logic tests
        run: node automation/mehrieh/tests/workflow_logic.js

      - name: Bridge integration harness
        run: php automation/mehrieh/tests/bridge_harness.php

      - name: Build verified production files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/plugin/cheraghi-content-bridge-v3
          cp automation/mehrieh/CHERAGHILAW-MEHRIEH-ARTICLES-ONLY-REAL-RANKMATH-v9.0.0.json dist/
          cp wordpress-plugin/cheraghi-content-bridge-v3/cheraghi-content-bridge-v3.php dist/plugin/cheraghi-content-bridge-v3/
          (cd dist/plugin && zip -qr ../CHERAGHI-CONTENT-BRIDGE-V3-v3.7.0.zip cheraghi-content-bridge-v3)
          rm -rf dist/plugin
          (cd dist && sha256sum CHERAGHILAW-MEHRIEH-ARTICLES-ONLY-REAL-RANKMATH-v9.0.0.json CHERAGHI-CONTENT-BRIDGE-V3-v3.7.0.zip > SHA256SUMS.txt)

      - name: Upload verified production files
        uses: actions/upload-artifact@v4
        with:
          name: cheraghi-mehrieh-v9.0.0-production-files
          path: dist/
          if-no-files-found: error
